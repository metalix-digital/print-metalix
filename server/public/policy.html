<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no"/>
__GTM_HEAD__
<title>__META_TITLE__</title>
<meta name="description" content="__META_DESCRIPTION__">
<meta name="keywords" content="__META_KEYWORDS__">
<meta name="robots" content="index,follow">
<link rel="canonical" href="__CANONICAL_URL__"/>
<meta property="og:type" content="website">
<meta property="og:site_name" content="Metalix Print">
<meta property="og:title" content="__META_TITLE__">
<meta property="og:description" content="__META_DESCRIPTION__">
<meta property="og:url" content="__CANONICAL_URL__">
<meta property="og:image" content="https://print.metalix.in/images/logo.svg">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="__META_TITLE__">
<meta name="twitter:description" content="__META_DESCRIPTION__">
<meta name="theme-color" content="#FF6600">
<link rel="icon" type="image/svg+xml" href="/images/logo.svg"/>
<link rel="preload" href="/fonts/Roboto-variable.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:'Roboto';font-style:normal;font-weight:400;font-display:swap;src:url(/fonts/Roboto-variable.woff2) format('woff2');}
@font-face{font-family:'Roboto';font-style:normal;font-weight:500;font-display:swap;src:url(/fonts/Roboto-variable.woff2) format('woff2');}
@font-face{font-family:'Roboto';font-style:normal;font-weight:600;font-display:swap;src:url(/fonts/Roboto-variable.woff2) format('woff2');}
@font-face{font-family:'Roboto';font-style:normal;font-weight:700;font-display:swap;src:url(/fonts/Roboto-variable.woff2) format('woff2');}
@font-face{font-family:'Roboto';font-style:normal;font-weight:800;font-display:swap;src:url(/fonts/Roboto-variable.woff2) format('woff2');}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
:root{
  --orange:#FF6600; --orange-d:#E05500; --orange-l:#FFF4EB; --orange-text:#C2410C; --orange-border:#FFCCA0;
  --ink:#1C1917; --ink2:#44403C; --ink3:#78716C; --ink-fixed:#1C1917;
  --line:#E7E5E4; --line-soft:#F0EFED; --line-hover:#C7C4C0;
  --white:#FFFFFF; --surface-hover:#F5F4F2; --paper:#FAFAF8;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 8px 24px -8px rgba(0,0,0,.14);
  --header-bg:rgba(250,250,248,.92);
  color-scheme:light;
}
[data-theme="dark"]{
  --orange-l:rgba(255,102,0,.16); --orange-border:rgba(255,102,0,.42);
  --ink:#F7F6F1; --ink2:#D9D4CC; --ink3:#ABA69C;
  --line:#3A3630; --line-soft:#2E2A25; --line-hover:#55504A;
  --white:#1F1D22; --surface-hover:#2A2730; --paper:#141316;
  --shadow:0 1px 3px rgba(0,0,0,.4),0 8px 24px -8px rgba(0,0,0,.6);
  --header-bg:rgba(20,19,22,.88);
  color-scheme:dark;
}
body{font-family:'Roboto',sans-serif;background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;transition:background-color .25s ease,color .25s ease;}
a{color:inherit;}

header{position:sticky;top:0;z-index:50;background:var(--header-bg);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);}
.header-inner{max-width:900px;margin:0 auto;padding:0 24px;display:flex;align-items:center;gap:8px;height:64px;}
.h-logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;}
.h-logo img{width:34px;height:34px;border-radius:50%;}
.h-logo span{font-family:'Roboto',sans-serif;font-weight:700;font-size:18px;letter-spacing:-.01em;}
nav{display:flex;align-items:center;gap:2px;margin-left:32px;}
nav a{font-size:14px;font-weight:600;color:var(--ink2);text-decoration:none;padding:8px 14px;border-radius:8px;transition:all .15s;}
nav a:hover{color:var(--ink);background:var(--surface-hover);}
nav a.active{color:var(--orange-text);}
.h-space{flex:1;}
.theme-toggle{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);background:var(--white);color:var(--ink3);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;transition:border-color .15s,transform .15s;}
.theme-toggle:hover{border-color:var(--line-hover);transform:translateY(-1px);}
@media(max-width:600px){ nav{display:none;} .header-inner{padding:0 16px;} }

.policy-wrap{max-width:800px;margin:0 auto;padding:56px 24px 90px;}
.section-eyebrow{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;color:var(--orange-text);background:var(--orange-l);border:1px solid var(--orange-border);padding:6px 12px;border-radius:999px;display:inline-block;margin-bottom:16px;}
.policy-wrap h1{font-family:'Roboto',sans-serif;font-weight:800;font-size:36px;letter-spacing:-.02em;margin-bottom:8px;}
.policy-wrap .meta{font-size:13px;color:var(--ink3);margin-bottom:40px;}
.policy-wrap .meta a{color:var(--orange-text);font-weight:600;}
.policy-tabs{display:flex;gap:0;border-bottom:2px solid var(--line);margin-bottom:36px;flex-wrap:wrap;}
.ptab{
  font-size:14px;font-weight:600;color:var(--ink3);background:none;border:none;
  display:inline-block;text-decoration:none;cursor:pointer;padding:12px 22px;
  border-bottom:2.5px solid transparent;margin-bottom:-2px;
  transition:all .15s;font-family:'Roboto',sans-serif;
}
.ptab.active{color:var(--orange-text);border-bottom-color:var(--orange);}
.ptab:hover:not(.active){color:var(--ink);}
.policy-article h2{font-family:'Roboto',sans-serif;font-size:22px;font-weight:700;margin:32px 0 12px;}
.policy-article h2:first-child{margin-top:0;}
.policy-article p{font-size:15px;color:var(--ink2);line-height:1.75;margin-bottom:14px;}
.policy-article ul{padding-left:20px;margin:0 0 16px;}
.policy-article li{font-size:15px;color:var(--ink2);line-height:1.75;margin-bottom:6px;}
.policy-article strong{color:var(--ink);}
.callout{
  background:var(--orange-l);border-left:4px solid var(--orange);
  border-radius:0 10px 10px 0;padding:16px 20px;margin:20px 0;
}
.callout p{color:var(--ink);margin:0;}

footer{background:var(--ink-fixed);color:#fff;padding:40px 24px;margin-top:20px;}
.footer-inner{max-width:900px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;font-size:13.5px;color:#C7C2BA;}
.footer-inner a{color:#fff;text-decoration:none;font-weight:600;}
.footer-inner a:hover{text-decoration:underline;}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>
<script>
(function(){
  try{
    var saved = localStorage.getItem('metalix_theme');
    var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
  }catch(e){}
})();
</script>
<script src="/js/analytics.js" defer></script>
</head>
<body>
__GTM_NOSCRIPT__

<header>
  <div class="header-inner">
    <a class="h-logo" href="/">
      <img src="/images/logo.svg" alt="Metalix Print">
      <span>Metalix Print</span>
    </a>
    <nav>
      <a href="/">Home</a>
      <a href="/blog">Blog</a>
      <a href="/policies/refund-reprint" class="active">Policies</a>
      <a href="/contact">Contact</a>
      <a href="/order">Place an order</a>
    </nav>
    <div class="h-space"></div>
    <button class="theme-toggle" type="button" id="themeToggle" aria-label="Toggle dark mode" title="Toggle dark mode"><span id="themeToggleIcon">🌙</span></button>
  </div>
</header>

<div class="policy-wrap">
  <div class="section-eyebrow">Legal & policies</div>
  <h1>__PAGE_H1__</h1>
  <p class="meta">__PAGE_META__</p>

  <div class="policy-tabs">
    <a class="ptab __TAB_REFUND_ACTIVE__" href="/policies/refund-reprint">Refund & Reprint</a>
    <a class="ptab __TAB_DELIVERY_ACTIVE__" href="/policies/delivery">Delivery</a>
    <a class="ptab __TAB_TERMS_ACTIVE__" href="/policies/terms-of-service">Terms of Service</a>
    <a class="ptab __TAB_PRIVACY_ACTIVE__" href="/policies/privacy">Privacy</a>
  </div>

  __CONTENT_HTML__
</div>

<footer>
  <div class="footer-inner">
    <span>© 2026 Metalix Print</span>
    <span><a href="/">Home</a> · <a href="/order">Place an order</a> · <a href="/blog">Blog</a> · <a href="/contact">Contact</a></span>
  </div>
</footer>

<script>
const themeToggle = document.getElementById('themeToggle');
const themeToggleIcon = document.getElementById('themeToggleIcon');
function syncThemeIcon(){ themeToggleIcon.textContent = document.documentElement.getAttribute('data-theme') === 'dark' ? '☀️' : '🌙'; }
syncThemeIcon();
themeToggle.addEventListener('click', () => {
  const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('metalix_theme', next);
  syncThemeIcon();
});
</script>

</body>
</html>
