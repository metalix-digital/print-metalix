<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no" />
<title>Page Not Found — Metalix Print</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --steel:#1A2332; --orange:#FF4D1C; --silver:#C8CDD6; --mist:#F2F4F7; --white:#FFFFFF; --body:#5B6472; --muted:#8893A2; color-scheme:light; }
  [data-theme="dark"]{ --steel:#F3F5F8; --silver:#454C5E; --mist:#101215; --white:#1B1D24; --body:#C7CCD6; --muted:#9BA3B5; color-scheme:dark; }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{ font-family:'Roboto', sans-serif; background:var(--mist); color:var(--steel); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; transition:background-color .25s ease,color .25s ease; }
  .card{ background:var(--white); border-radius:20px; max-width:420px; width:100%; padding:40px 32px; text-align:center; box-shadow:0 20px 48px -20px rgba(26,35,50,.28); }
  .logo{ font-size:19px; font-weight:700; font-family:'Roboto',sans-serif; }
  .logo .dot{ color:var(--orange); }
  .badge{ margin:22px auto 0; width:64px; height:64px; border-radius:50%; background:var(--mist); display:flex; align-items:center; justify-content:center; font-size:28px; }
  h1{ font-size:22px; font-weight:800; font-family:'Roboto',sans-serif; margin:20px 0 10px; }
  .sub{ font-size:14.5px; color:var(--body); line-height:1.6; margin:0 0 26px; }
  .home-link{ display:inline-block; background:var(--orange); color:#fff; text-decoration:none; font-weight:700; font-size:14px; padding:12px 24px; border-radius:10px; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">Metalix<span class="dot">.</span>Print</div>
    <div class="badge">🔍</div>
    <h1>Page not found</h1>
    <p class="sub">The page you're looking for doesn't exist or may have moved.</p>
    <a class="home-link" href="/">Back to homepage</a>
  </div>
</body>
</html>
