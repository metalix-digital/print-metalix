<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no"/>
__GTM_HEAD__
<title>Your Cart — Metalix Print</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/svg+xml" href="/images/logo.svg"/>
<style>
@font-face{font-family:'Roboto';font-style:normal;font-weight:400;font-display:swap;src:url(/fonts/Roboto-variable.woff2) format('woff2');}
@font-face{font-family:'Roboto';font-style:normal;font-weight:500;font-display:swap;src:url(/fonts/Roboto-variable.woff2) format('woff2');}
@font-face{font-family:'Roboto';font-style:normal;font-weight:600;font-display:swap;src:url(/fonts/Roboto-variable.woff2) format('woff2');}
@font-face{font-family:'Roboto';font-style:normal;font-weight:700;font-display:swap;src:url(/fonts/Roboto-variable.woff2) format('woff2');}
@font-face{font-family:'Roboto';font-style:normal;font-weight:800;font-display:swap;src:url(/fonts/Roboto-variable.woff2) format('woff2');}
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --orange:#FF6600; --orange-d:#E05500; --orange-l:#FFF4EB;
  --ink:#1C1917; --ink2:#44403C; --ink3:#78716C;
  --paper:#FAFAF8; --card:#FFFFFF; --line:#E7E5E4; --line-strong:#C7C4C0;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 8px 24px -8px rgba(0,0,0,.14);
  color-scheme:light;
}
[data-theme="dark"]{
  --ink:#F7F6F1; --ink2:#D9D4CC; --ink3:#ABA69C;
  --paper:#141316; --card:#1F1D22; --line:#3A3630; --line-strong:#55504A;
  --orange-l:rgba(255,102,0,.16);
  color-scheme:dark;
}
body{font-family:'Roboto',sans-serif;background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;}
a{color:inherit;}
h1{font-family:'Roboto',sans-serif;}
header{position:sticky;top:0;z-index:40;background:var(--paper);border-bottom:1px solid var(--line);}
.header-inner{max-width:900px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:16px;}
.h-logo{display:flex;align-items:center;gap:9px;text-decoration:none;font-family:'Roboto';font-weight:800;font-size:19px;color:var(--ink);}
.h-logo img{height:30px;width:30px;}
.h-logo span:last-child{color:var(--orange);}
.h-back{margin-left:auto;text-decoration:none;color:var(--ink2);font-weight:600;font-size:14px;}
main{max-width:900px;margin:0 auto;padding:28px 20px 100px;}
h1{font-size:26px;margin-bottom:20px;}
.cart-item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:14px;margin-bottom:12px;box-shadow:var(--shadow);}
.ci-thumb{width:56px;height:56px;border-radius:10px;background:var(--orange-l);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;overflow:hidden;}
.ci-thumb img{width:100%;height:100%;object-fit:cover;}
.ci-main{flex:1;min-width:0;}
.ci-type{font-size:10.5px;font-weight:700;color:var(--orange-d);text-transform:uppercase;letter-spacing:.04em;}
.ci-name{font-weight:700;font-size:15px;}
.ci-meta{font-size:12.5px;color:var(--ink3);margin-top:2px;}
.ci-qty{display:flex;align-items:center;border:1.5px solid var(--line-strong);border-radius:9px;overflow:hidden;flex-shrink:0;}
.ci-qty button{background:var(--card);border:none;width:28px;height:32px;cursor:pointer;font-size:15px;color:var(--ink2);}
.ci-qty input{width:34px;border:none;text-align:center;font-size:13.5px;font-weight:700;background:var(--card);color:var(--ink);}
.ci-price{font-weight:800;font-size:15px;width:70px;text-align:right;flex-shrink:0;}
.ci-remove{background:none;border:none;color:var(--ink3);font-size:17px;cursor:pointer;flex-shrink:0;padding:4px;}
.ci-remove:hover{color:#DC2626;}
.summary{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:20px;box-shadow:var(--shadow);}
.summary-row{display:flex;justify-content:space-between;font-size:14.5px;padding:5px 0;color:var(--ink2);}
.summary-row.total{font-weight:800;font-size:18px;color:var(--ink);border-top:1px solid var(--line);margin-top:8px;padding-top:12px;}
.checkout-btn{display:block;width:100%;text-align:center;text-decoration:none;background:var(--orange);color:#fff;border:none;border-radius:11px;padding:14px;font-weight:800;font-size:15px;margin-top:16px;cursor:pointer;}
.checkout-btn:hover{background:var(--orange-d);}
.continue-link{display:block;text-align:center;margin-top:14px;color:var(--ink2);font-weight:600;font-size:13.5px;text-decoration:none;}
.empty-cart{text-align:center;padding:70px 20px;color:var(--ink3);}
.empty-cart a{color:var(--orange);font-weight:700;text-decoration:none;}
.note{background:var(--orange-l);border:1px solid var(--line-strong);border-radius:10px;padding:10px 14px;font-size:12.5px;color:var(--ink2);margin-bottom:18px;}
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <a class="h-logo" href="/"><img src="/images/logo.svg" alt="Metalix Print"><span>Metalix<span> Print</span></span></a>
    <a class="h-back" href="/stationery">← Continue shopping</a>
  </div>
</header>
<main>
  <h1>Your Cart</h1>
  <div class="note">Printing items (documents / photos) are configured and added on the <a href="/order" style="color:var(--orange-d);font-weight:700;">Print</a> page — they'll appear together with everything below at checkout.</div>
  <div id="cartItems"></div>
  <div id="cartSummaryWrap"></div>
</main>
<script src="/js/cart.js"></script>
<script>
(function(){
  var THEME_KEY = 'metalix_theme';
  function applyTheme(t){ document.documentElement.setAttribute('data-theme', t); }
  applyTheme(localStorage.getItem(THEME_KEY) || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
})();

function escHtml(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }

function typeLabel(item){
  if (item.productType === 'stationery') return 'Stationery';
  if (item.productType === 'stamp') return 'Custom Stamp';
  return item.productType;
}
function itemLineTotal(item){
  return (item.unitPrice || 0) * (item.quantity || 1);
}

function render(){
  var items = Cart.getAll();
  var wrap = document.getElementById('cartItems');
  var summaryWrap = document.getElementById('cartSummaryWrap');
  if (!items.length) {
    wrap.innerHTML = '<div class="empty-cart">Your cart is empty. <a href="/stationery">Browse Stationery</a> or <a href="/stamps">create a Stamp</a>.</div>';
    summaryWrap.innerHTML = '';
    return;
  }
  wrap.innerHTML = items.map(function(item){
    var thumb = item.image ? '<img src="' + escHtml(item.image) + '" alt="">' : (item.productType === 'stamp' ? '🔖' : '📦');
    var meta = item.productType === 'stamp'
      ? escHtml((item.stampTypeLabel || '') + (item.stampSizeLabel ? ' · ' + item.stampSizeLabel : ''))
      : (item.sku ? 'SKU ' + escHtml(item.sku) : '');
    var qtyControl = item.productType === 'stamp'
      ? '<span style="font-weight:700;font-size:13.5px;">×' + item.quantity + '</span>'
      : '<div class="ci-qty"><button type="button" data-step="-1" data-id="' + item.cartItemId + '">−</button>' +
        '<input type="text" value="' + item.quantity + '" data-id="' + item.cartItemId + '" class="qty-input" inputmode="numeric">' +
        '<button type="button" data-step="1" data-id="' + item.cartItemId + '">+</button></div>';
    return (
      '<div class="cart-item" data-id="' + item.cartItemId + '">' +
        '<div class="ci-thumb">' + thumb + '</div>' +
        '<div class="ci-main"><div class="ci-type">' + typeLabel(item) + '</div><div class="ci-name">' + escHtml(item.name || 'Item') + '</div>' +
          (meta ? '<div class="ci-meta">' + meta + '</div>' : '') + '</div>' +
        qtyControl +
        '<div class="ci-price">₹' + itemLineTotal(item) + '</div>' +
        '<button class="ci-remove" data-id="' + item.cartItemId + '" title="Remove">✕</button>' +
      '</div>'
    );
  }).join('');

  var subtotal = items.reduce(function(sum, it){ return sum + itemLineTotal(it); }, 0);
  summaryWrap.innerHTML =
    '<div class="summary">' +
      '<div class="summary-row"><span>Items (' + items.reduce(function(s,i){return s+i.quantity;},0) + ')</span><span>₹' + subtotal + '</span></div>' +
      '<div class="summary-row" style="font-size:12.5px;color:var(--ink3);">Delivery &amp; any print costs are calculated at checkout</div>' +
      '<div class="summary-row total"><span>Subtotal</span><span>₹' + subtotal + '</span></div>' +
      '<a class="checkout-btn" href="/order">Proceed to Checkout →</a>' +
      '<a class="continue-link" href="/stationery">Continue shopping</a>' +
    '</div>';
}

document.getElementById('cartItems').addEventListener('click', function(e){
  var id = e.target.dataset.id;
  if (!id) return;
  if (e.target.classList.contains('ci-remove')) { Cart.remove(id); render(); return; }
  var step = e.target.closest('[data-step]');
  if (step) {
    var items = Cart.getAll();
    var item = items.find(function(i){ return i.cartItemId === id; });
    if (!item) return;
    Cart.setQuantity(id, (item.quantity || 1) + Number(step.dataset.step));
    render();
  }
});
document.getElementById('cartItems').addEventListener('change', function(e){
  if (!e.target.classList.contains('qty-input')) return;
  Cart.setQuantity(e.target.dataset.id, e.target.value);
  render();
});

render();
</script>
</body>
</html>
