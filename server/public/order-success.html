<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Order Confirmed — Metalix Print</title>
<!-- Transactional, per-order page — never indexed. -->
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --steel:#1A2332; --orange:#FF4D1C; --silver:#C8CDD6; --mist:#F2F4F7; --white:#FFFFFF;
    --muted:#8893A2; --body:#5B6472; --green:#15803D; --green-bg:#E7F6EC; --red:#DC2626; --red-bg:#FCEBEB;
    --warn:#B45309; --warn-bg:#FFF1E6; --divider:#F2F4F7; --orange-ring:#FFE7DC;
    --steel-fixed:#1A2332; --green-fixed:#15803D;
    color-scheme:light;
  }
  [data-theme="dark"]{
    --steel:#F3F5F8; --silver:#454C5E; --mist:#101215; --white:#1B1D24;
    --muted:#9BA3B5; --body:#C7CCD6; --green:#4ADE80; --green-bg:rgba(34,197,94,.16);
    --red:#F87171; --red-bg:rgba(220,38,38,.2); --warn:#FBBF24; --warn-bg:rgba(180,83,9,.22);
    --divider:#2A2D36; --orange-ring:rgba(255,77,28,.28);
    color-scheme:dark;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{ font-family:'Inter', sans-serif; background:var(--mist); color:var(--steel); min-height:100vh; display:flex; align-items:flex-start; justify-content:center; padding:32px 16px 60px; transition:background-color .25s ease,color .25s ease; }
  .wrap{ max-width:420px; width:100%; }
  .brand{ text-align:center; font-size:19px; font-weight:700; font-family:'Sora',sans-serif; margin-bottom:18px; position:relative; }
  .brand .dot{ color:var(--orange); }
  .theme-toggle{ position:absolute; right:0; top:50%; transform:translateY(-50%); width:32px; height:32px; border-radius:50%; border:1.5px solid var(--silver); background:var(--white); color:var(--muted); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:14px; }
  .theme-toggle:hover{ border-color:var(--orange); }
  .back-btn{ position:absolute; left:0; top:50%; transform:translateY(-50%); width:32px; height:32px; border-radius:50%; border:1.5px solid var(--silver); background:var(--white); color:var(--muted); display:flex; align-items:center; justify-content:center; font-size:16px; text-decoration:none; }
  .back-btn:hover{ border-color:var(--orange); }

  .card{ background:var(--white); border-radius:18px; box-shadow:0 16px 40px -20px rgba(26,35,50,.25); overflow:hidden; margin-bottom:14px; }

  .hero{ padding:30px 24px 24px; text-align:center; color:#fff; background:linear-gradient(135deg,#0F6B37,var(--green-fixed)); }
  .hero-icon{ width:56px; height:56px; border-radius:50%; background:rgba(255,255,255,.18); display:flex; align-items:center; justify-content:center; margin:0 auto 14px; }
  .hero-status{ font-size:20px; font-weight:800; margin-bottom:4px; }
  .hero-sub{ font-size:12.5px; opacity:.9; }

  .meta{ padding:18px 22px 6px; }
  .row{ display:flex; justify-content:space-between; align-items:center; gap:10px; font-size:13px; padding:11px 0; border-bottom:1px solid var(--divider); }
  .row:last-child{ border-bottom:none; }
  .row .k{ color:var(--muted); font-weight:600; }
  .row .v{ font-weight:700; text-align:right; }
  .row .v.total{ color:var(--orange); font-size:15px; }

  .actions{ padding:18px 22px 22px; display:flex; flex-direction:column; gap:10px; }
  .btn{ display:block; text-align:center; text-decoration:none; border-radius:10px; padding:12px; font-weight:700; font-size:14px; cursor:pointer; border:none; }
  .btn-primary{ background:var(--orange); color:#fff; }
  .btn-ghost{ background:var(--mist); color:var(--steel); border:1.5px solid var(--silver); }

  .footer{ text-align:center; margin-top:6px; font-size:11px; color:var(--muted); }
  .error{ color:var(--body); font-size:14px; text-align:center; padding:40px 20px; }
</style>
<script>
(function(){
  try{
    var saved = localStorage.getItem('metalix_theme');
    var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
  }catch(e){}
})();
</script>
<script src="/js/analytics.js" defer></script>
</head>
<body>

<div class="wrap">
  <div class="brand"><a class="back-btn" href="/" aria-label="Back to home" title="Back to home">←</a>Metalix<span class="dot">.</span>Print<button class="theme-toggle" type="button" id="themeToggle" aria-label="Toggle dark mode" title="Toggle dark mode"><span id="themeToggleIcon">🌙</span></button></div>
  <div id="content">
    <div class="card"><p class="error">Loading…</p></div>
  </div>
  <div class="footer">print.metalix.in</div>
</div>

<script>
/* -- THEME TOGGLE -- */
(function(){
  const THEME_KEY = 'metalix_theme';
  const btn = document.getElementById('themeToggle');
  const icon = document.getElementById('themeToggleIcon');
  function syncIcon(){
    icon.textContent = document.documentElement.getAttribute('data-theme') === 'dark' ? '☀️' : '🌙';
  }
  syncIcon();
  btn.addEventListener('click', () => {
    const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem(THEME_KEY, next);
    syncIcon();
  });
})();

function formatDateTime(ms){
  if(!ms) return '—';
  const d = new Date(ms);
  const day = d.getDate();
  const month = d.toLocaleString('en-US', { month: 'short' });
  let h = d.getHours();
  const m = String(d.getMinutes()).padStart(2, '0');
  const ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12; if (h === 0) h = 12;
  return `${day} ${month} · ${h}:${m} ${ampm}`;
}

function deliveryTimingLabel(order){
  if(order.delivery_method !== 'delivery') return null;
  return order.delivery_timing === 'scheduled'
    ? 'Scheduled — ' + formatDateTime(order.scheduled_at)
    : 'Instant (within 2 hrs)';
}

// Fires the GA4 'purchase' conversion once analytics.js has wired up gtag AND
// the order has loaded — guarded by sessionStorage so a page refresh (or the
// two readiness signals racing) never double-counts the conversion.
let orderForAnalytics = null;
let ga4Ready = false;
function tryFirePurchase(){
  if(!orderForAnalytics || !ga4Ready || typeof window.gtag !== 'function') return;
  const order = orderForAnalytics;
  const flagKey = 'metalix_ga4_purchase_' + order.id;
  if(sessionStorage.getItem(flagKey)) return;
  sessionStorage.setItem(flagKey, '1');
  window.gtag('event', 'purchase', {
    transaction_id: order.id,
    value: order.total_amount,
    currency: 'INR',
    shipping: order.delivery_charge || 0,
    items: [{
      item_name: 'Print order',
      item_category: order.print_mode,
      quantity: order.copies || 1,
      price: order.total_amount
    }]
  });
}
window.addEventListener('metalix-ga4-ready', () => { ga4Ready = true; tryFirePurchase(); });

async function loadOrder(){
  const orderId = window.location.pathname.split('/').filter(Boolean).pop();
  const content = document.getElementById('content');
  try {
    const res = await fetch('/api/orders/' + encodeURIComponent(orderId));
    if (!res.ok) {
      content.innerHTML = '<div class="card"><p class="error">We couldn\'t find that order.</p></div>';
      return;
    }
    const data = await res.json();
    const order = data.order;
    const isCod = order.payment_method === 'cod';
    const timingLabel = deliveryTimingLabel(order);

    content.innerHTML =
      '<div class="card">' +
        '<div class="hero">' +
          '<div class="hero-icon"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3"><path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"/></svg></div>' +
          '<div class="hero-status">' + (isCod ? 'Order placed!' : 'Payment successful') + '</div>' +
          '<div class="hero-sub">' + (isCod ? 'Pay in cash or by UPI on delivery / at pickup.' : 'Your order has been queued for printing.') + '</div>' +
        '</div>' +
        '<div class="meta">' +
          '<div class="row"><span class="k">Order ID</span><span class="v">' + order.id + '</span></div>' +
          '<div class="row"><span class="k">Transaction ID</span><span class="v">' + (isCod ? 'Pay on delivery' : (order.razorpay_payment_id || '—')) + '</span></div>' +
          '<div class="row"><span class="k">Print cost</span><span class="v">₹' + order.print_cost + '</span></div>' +
          (order.handling_charge ? '<div class="row"><span class="k">Handling charge</span><span class="v">₹' + order.handling_charge + '</span></div>' : '') +
          (order.delivery_charge ? '<div class="row"><span class="k">Delivery charge</span><span class="v">₹' + order.delivery_charge + '</span></div>' : '') +
          (order.gst_amount ? '<div class="row"><span class="k">GST</span><span class="v">₹' + order.gst_amount + '</span></div>' : '') +
          '<div class="row"><span class="k">Amount ' + (isCod ? 'due' : 'paid') + '</span><span class="v total">₹' + order.total_amount + '</span></div>' +
          '<div class="row"><span class="k">Order status</span><span class="v">' + order.order_status + '</span></div>' +
          '<div class="row"><span class="k">Delivery</span><span class="v">' + (order.delivery_method === 'delivery' ? 'Home delivery' : 'Shop pickup') + '</span></div>' +
          (timingLabel ? '<div class="row"><span class="k">Delivery timing</span><span class="v">' + timingLabel + '</span></div>' : '') +
        '</div>' +
        '<div class="actions">' +
          '<a class="btn btn-primary" href="/track/' + encodeURIComponent(order.id) + '">Track your order</a>' +
          '<a class="btn btn-ghost" href="/order">Place another order</a>' +
        '</div>' +
      '</div>';

    orderForAnalytics = order;
    tryFirePurchase();
  } catch (err) {
    content.innerHTML = '<div class="card"><p class="error">Could not load your order.</p></div>';
  }
}
loadOrder();
</script>

</body>
</html>
